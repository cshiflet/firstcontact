<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!--
    A 270 deg arc with a small L-shaped arrow head at the top.
    Centered on (12, 12) with radius 8 - i.e., a true circle that
    happens to have a notch + arrow at the upper-right. Spins
    cleanly around its center because the geometry is symmetric
    around the same center the rotation transform uses.
  -->
  <path d="M20 12 A8 8 0 1 1 12 4"/>
  <polyline points="8 4 12 4 12 0"/>
</svg>
